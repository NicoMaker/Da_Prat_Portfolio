<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Da Prat — Graphic Designer & Visual Storyteller</title>
<meta name="description" content="Portfolio di Da Prat, Graphic Designer specializzato in identità visive, editoria e packaging.">
<meta name="theme-color" content="#EFEEE9">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>

<!-- ========== PRELOADER ========== -->
<div class="preloader" id="preloader">
  <div class="preloader__label" id="preloaderLabel">DP.</div>
  <div class="preloader__bar"><span id="preloaderFill"></span></div>
  <div class="preloader__pct" id="preloaderPct">0%</div>
</div>

<!-- ========== CUSTOM CURSOR ========== -->
<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<!-- ========== HEADER (componente: nav) ========== -->
<header class="nav" id="nav">
  <a href="#home" class="nav__logo" data-cursor-link id="navLogo">DP<span class="dot">.</span></a>

  <nav class="nav__links" id="navLinks"></nav>

  <a href="#contatti" class="nav__cta" data-cursor-link>Scrivimi</a>

  <button class="nav__burger" id="navBurger" aria-label="Apri menu" aria-expanded="false" aria-controls="mobileMenu">
    <span></span><span></span><span></span>
  </button>

  <span class="nav__color-bar" id="navColorBar" aria-hidden="true"></span>
</header>

<!-- ========== MOBILE MENU (componente) ========== -->
<div class="mobile-menu" id="mobileMenu">
  <span class="mobile-menu__color-bar" id="mobileMenuColorBar" aria-hidden="true"></span>
  <nav class="mobile-menu__links" id="mobileMenuLinks"></nav>
  <div class="mobile-menu__foot" id="mobileMenuFoot"></div>
</div>
<div class="mobile-menu__backdrop" id="mobileMenuBackdrop"></div>

<main>

  <!-- ========== HERO (componente) ========== -->
  <section class="hero" id="home">
    <div class="hero__grid" aria-hidden="true"></div>

    <div class="hero__top container">
      <span class="badge" id="heroBadge"><span class="badge__dot"></span></span>

      <div class="stamp" aria-hidden="true">
        <svg viewBox="0 0 120 120" class="stamp__svg">
          <defs>
            <path id="stampCircle" d="M60,60 m-46,0 a46,46 0 1,1 92,0 a46,46 0 1,1 -92,0" />
          </defs>
          <text class="stamp__text">
            <textPath href="#stampCircle" id="stampText" startOffset="0%"></textPath>
          </text>
          <circle cx="60" cy="60" r="20" fill="none" stroke="currentColor" stroke-width="1"/>
        </svg>
        <span class="stamp__center" id="stampCenter">DP</span>
      </div>
    </div>

    <h1 class="hero__title container" id="heroTitle"></h1>

    <div class="hero__bottom container">
      <p class="hero__desc" id="heroDesc"></p>
      <div class="hero__actions" id="heroActions"></div>
    </div>

    <div class="hero__scroll" aria-hidden="true">
      <span id="heroScrollLabel">Scorri</span>
      <div class="hero__scroll-line"><i></i></div>
    </div>
  </section>

  <!-- ========== MARQUEE (componente) ========== -->
  <div class="marquee">
    <div class="marquee__track" id="marqueeTrack"></div>
  </div>

  <!-- ========== CHI SONO / ABOUT (componente) ========== -->
  <section class="about" id="chi-sono">
    <div class="container about__grid">
      <div class="about__label reveal-up">
        <span class="eyebrow-mark" id="aboutEyebrow"></span>
      </div>

      <div class="about__text reveal-up" id="aboutText"></div>

      <div class="about__stats" id="aboutStats"></div>
    </div>
  </section>

  <!-- ========== PROGETTI (componente) ========== -->
  <section class="work" id="progetti">
    <div class="container">
      <div class="work__head">
        <h2 class="section-title reveal-up">
          Progetti <span class="section-title__muted">selezionati</span>
        </h2>
        <p class="work__intro reveal-up">
          Una selezione di lavori tra identità visive, editoria e packaging.
          Filtra per categoria o apri un progetto per i dettagli.
        </p>
      </div>

      <div class="filters reveal-up" id="filters" role="tablist" aria-label="Filtra progetti"></div>

      <div class="grid" id="projectGrid"></div>
    </div>
  </section>

  <!-- ========== SERVIZI (componente) ========== -->
  <section class="services" id="servizi">
    <div class="container">
      <h2 class="section-title reveal-up">
        Come posso <span class="section-title__muted">aiutarti</span>
      </h2>
      <div class="services__list" id="servicesList"></div>
    </div>
  </section>

  <!-- ========== COMPETENZE (componente) ========== -->
  <section class="skills" id="competenze">
    <div class="container skills__grid">
      <div class="skills__col reveal-up">
        <h2 class="section-title">Strumenti</h2>
        <div class="skillbars" id="skillbars"></div>
      </div>

      <!-- ========== PERCORSO / TIMELINE (componente) ========== -->
      <div class="skills__col reveal-up" id="percorso">
        <h2 class="section-title">Percorso</h2>
        <div class="timeline" id="timeline"></div>
      </div>
    </div>
  </section>

  <!-- ========== CONTATTI (componente) ========== -->
  <section class="contact" id="contatti">
    <div class="container contact__grid">
      <div class="contact__left reveal-up">
        <h2 class="section-title">Parliamo del tuo <span class="section-title__muted">progetto</span></h2>
        <p class="contact__intro" id="contactIntro"></p>
        <div class="contact__info" id="contactInfo"></div>
      </div>

      <form class="contact__form reveal-up" id="contactForm" autocomplete="off">
        <div class="field">
          <label for="cfName">Nome</label>
          <input type="text" id="cfName" name="name" required placeholder="Il tuo nome">
        </div>
        <div class="field">
          <label for="cfEmail">Email</label>
          <input type="email" id="cfEmail" name="email" required placeholder="nome@email.it">
        </div>
        <div class="field">
          <label for="cfMessage">Messaggio</label>
          <textarea id="cfMessage" name="message" rows="5" required placeholder="Raccontami del tuo progetto..."></textarea>
        </div>
        <button type="submit" class="btn btn--primary" data-cursor-link>
          Invia messaggio
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <p class="field__note" id="formNote" aria-live="polite"></p>
      </form>
    </div>
  </section>

</main>

<!-- ========== FOOTER (componente) ========== -->
<footer class="footer" id="footer">
  <div class="container footer__top">
    <div class="footer__brand">
      <span class="footer__logo" id="footerLogo">DP<span class="dot">.</span></span>
      <p class="footer__cta" id="footerCta"></p>
      <p class="footer__cta-sub" id="footerCtaSub"></p>
    </div>

    <nav class="footer__links" id="footerLinks"></nav>

    <div class="footer__contact" id="footerContact">
      <!-- email e cellulare vengono inseriti qui via JS -->
    </div>
  </div>

  <div class="container footer__bottom">
    <span id="footerCopy"></span>
    <div class="footer__social" id="footerSocial"></div>
  </div>
</footer>

<!-- ========== MODALE PROGETTO (componente) ========== -->
<div class="modal" id="projectModal" aria-hidden="true">
  <div class="modal__backdrop" id="modalBackdrop"></div>
  <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal__close" id="modalClose" aria-label="Chiudi">✕</button>
    <span class="modal__cat" id="modalCat"></span>
    <h3 class="modal__title" id="modalTitle"></h3>
    <span class="modal__year" id="modalYear"></span>
    <p class="modal__desc" id="modalDesc"></p>
    <div class="modal__tools">
      <span class="modal__tools-label">Strumenti</span>
      <span id="modalTools"></span>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/nav.js"></script>
<script src="js/render.js"></script>
<script src="js/projects.js"></script>
<script src="js/cursor.js"></script>
<script src="js/animations.js"></script>
<script src="js/contact-form.js"></script>
<script src="js/main.js"></script>
</body>
</html>
